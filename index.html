<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- viewport-fit=cover → content extends under notch/home indicator -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- PWA / install meta -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="USSD" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Interactive USSD menu simulator" />

    <!-- iOS home screen icons -->
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

    <!-- UI font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Electrolize&display=swap" rel="stylesheet" />

    <title>USSD *123#</title>

    <style>
      /* ── Reset ── */
      *, *::before, *::after { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        background: #000;
        height: 100%;
        /* Prevent iOS rubber-band overscroll */
        overscroll-behavior: none;
      }

      #root {
        height: 100%;
      }

      /* Prevent text selection on tap anywhere in the app */
      * {
        -webkit-user-select: none;
        user-select: none;
        /* Remove blue flash on tap (Android) */
        -webkit-tap-highlight-color: transparent;
      }

      /* Allow selection only inside actual text content areas */
      .selectable {
        -webkit-user-select: text;
        user-select: text;
      }

      /* iOS momentum scroll for scrollable areas */
      .scroll-momentum {
        -webkit-overflow-scrolling: touch;
      }

      /* Hide scrollbar but keep scroll behaviour */
      .scroll-momentum::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
